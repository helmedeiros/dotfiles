name: tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: bats + shellcheck
    # macOS: the suite exercises macOS-specific tooling (defaults, PlistBuddy,
    # ditto, codesign). On ubuntu the tests that matter would all skip, which
    # would be a green tick proving nothing.
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # git-filter-repo backs bin/git-credit-all and is in the Brewfile; without
      # it three tests fail on the runner and pass on a developer laptop.
      - name: Install bats, shellcheck and git-filter-repo
        run: brew install bats-core shellcheck git-filter-repo

      # The suite reports how many suites ran and how many scripts were linted.
      # Both numbers are asserted below, so a suite silently disappearing — or
      # the allowlist quietly swallowing the whole repo — fails the build rather
      # than passing with less coverage.
      # pipefail is essential: piping to tee otherwise reports tee's exit status,
      # so the job went green over a suite with three failing tests.
      - name: Run the test suite
        run: |
          set -o pipefail
          ./test/run_tests.sh | tee /tmp/test-output.txt

      - name: Assert coverage did not silently shrink
        run: |
          suites=$(grep -oE 'Ran [0-9]+ test suites' /tmp/test-output.txt | grep -oE '[0-9]+')
          enforced=$(grep -oE 'Lint: [0-9]+ enforced' /tmp/test-output.txt | grep -oE '[0-9]+')
          echo "suites=$suites enforced=$enforced"
          [ "${suites:-0}" -ge 13 ] || { echo "test suites dropped below 13"; exit 1; }
          [ "${enforced:-0}" -ge 80 ] || { echo "linted scripts dropped below 80"; exit 1; }
